name: Build Native Android App

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'apps/mobile/**'
      - '.github/workflows/android-apk.yml'

permissions:
  contents: write

jobs:
  build-native-android:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/mobile
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Install native app dependencies
        run: npm install

      - name: TypeScript check
        run: npm run typecheck

      - name: Generate real Android native project
        env:
          EXPO_PUBLIC_SUPABASE_URL: ${{ secrets.EXPO_PUBLIC_SUPABASE_URL }}
          EXPO_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.EXPO_PUBLIC_SUPABASE_ANON_KEY }}
        run: npx expo prebuild --platform android --non-interactive

      - name: Build standalone release APK with embedded JavaScript
        working-directory: apps/mobile/android
        run: |
          chmod +x gradlew
          ./gradlew clean assembleRelease
          APK="$(find app/build/outputs/apk/release -maxdepth 1 -type f -name '*.apk' | head -n 1)"
          test -n "$APK"
          mkdir -p ../../dist
          cp "$APK" ../../dist/ain-salah-express-native.apk

      - name: Publish native APK
        working-directory: .
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="native-android-v1.0.${{ github.run_number }}"
          gh release create "$TAG" apps/dist/ain-salah-express-native.apk \
            --title "AIN SALAH EXPRESS Native Android ${TAG}" \
            --notes "Standalone React Native Android release APK with embedded JavaScript bundle. Customer and driver app. Admin and merchant portals remain on the website."
